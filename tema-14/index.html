<script>
(function(){
  var D = JSON.parse(document.getElementById('datos').textContent);
  var CLAVE_LOCAL = 'guias_llave_' + D.repo + '_' + D.sal;
  var te = new TextEncoder();
  function deB64(s){ var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function aB64(u){ var s = ''; for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); }
  function unir(a, b){ var u = new Uint8Array(a.length + b.length); u.set(a); u.set(b, a.length); return u; }
  function hmac(llave, datos){
    return crypto.subtle.importKey('raw', llave, {name: 'HMAC', hash: 'SHA-256'}, false, ['sign'])
      .then(function(k){ return crypto.subtle.sign('HMAC', k, datos); })
      .then(function(r){ return new Uint8Array(r); });
  }
  function derivar(clave){
    return crypto.subtle.importKey('raw', te.encode(clave), 'PBKDF2', false, ['deriveBits'])
      .then(function(k){ return crypto.subtle.deriveBits({name: 'PBKDF2', hash: 'SHA-256', salt: deB64(D.sal), iterations: D.iter}, k, 256); })
      .then(function(r){ return new Uint8Array(r); });
  }
  function abrir(maestra, antesDeMostrar){
    var iv = deB64(D.iv), ct = deB64(D.ct), kMac, kCif;
    return Promise.all([hmac(maestra, te.encode('enc')), hmac(maestra, te.encode('mac'))])
      .then(function(k){ kCif = k[0]; kMac = k[1]; return hmac(kMac, unir(iv, ct)); })
      .then(function(mac){
        var esperado = deB64(D.mac), igual = mac.length === esperado.length;
        for (var i = 0; i < mac.length; i++) igual = igual && mac[i] === esperado[i];
        if (!igual) throw new Error('clave');
        return crypto.subtle.importKey('raw', kCif, 'AES-CBC', false, ['decrypt']);
      })
      .then(function(k){ return crypto.subtle.decrypt({name: 'AES-CBC', iv: iv}, k, ct); })
      .then(function(html){
        var texto = new TextDecoder().decode(html);
        if (antesDeMostrar) antesDeMostrar();
        document.open(); document.write(texto); document.close();
      });
  }
  var f = document.getElementById('f'), err = document.getElementById('err'), btn = document.getElementById('btn');
  if (!window.crypto || !crypto.subtle) {
    err.textContent = 'Este navegador no permite abrir la guía. Usa una versión reciente de Chrome, Edge, Firefox o Safari.';
    btn.disabled = true; return;
  }
  // Apertura automática con la llave recordada. Debe esperar a que esta página termine de cargar:
  // si document.open() se llama mientras el navegador aún la está leyendo, la guía se mezcla con ella.
  function alCargar(fn){ if (document.readyState === 'complete') fn(); else window.addEventListener('load', fn); }
  try {
    var guardada = localStorage.getItem(CLAVE_LOCAL);
    if (guardada) alCargar(function(){
      abrir(deB64(guardada)).catch(function(){ try { localStorage.removeItem(CLAVE_LOCAL); } catch(e){} });
    });
  } catch(e){}
  f.addEventListener('submit', function(ev){
    ev.preventDefault();
    var clave = document.getElementById('clave').value;
    if (!clave) return;
    // Se lee antes de abrir: al mostrar la guía, este formulario deja de existir.
    var recordar = document.getElementById('recordar').checked;
    btn.disabled = true; err.textContent = '';
    derivar(clave)
      .then(function(m){
        return abrir(m, function(){
          // Se guarda la llave derivada (no la clave escrita), y solo si la clave fue correcta.
          if (recordar) { try { localStorage.setItem(CLAVE_LOCAL, aB64(m)); } catch(e){} }
        });
      })
      .catch(function(){
        btn.disabled = false;
        err.textContent = 'Clave incorrecta. Revisa mayúsculas y vuelve a intentar.';
        document.getElementById('clave').select();
      });
  });
})();
</script>
</body>
